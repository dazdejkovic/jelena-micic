<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="brand" href="{{ '/' | relative_url }}">JELENA MIĆIĆ</a>
      <div class="navlinks">
        <a href="#uspeh">Uspeh</a>
        <a href="#hronologija">Hronologija</a>
        <a href="#galerija">Galerija</a>
        <a href="#video">Video</a>
        <a href="#mediji">Mediji</a>
      </div>
    </nav>
  </div>
</header>
{{ content }}
<footer>
  <div class="wrap">Nezvanična informativna stranica zasnovana na javno dostupnim objavama zvaničnih institucija i medija.</div>
</footer>
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Zatvori">×</button>
  <div class="lightbox-inner">
    <div class="lightbox-image-wrap">
      <button class="lb-btn lb-prev" id="lbPrev" aria-label="Prethodna slika">‹</button>
      <img id="lbImage" src="" alt="">
      <button class="lb-btn lb-next" id="lbNext" aria-label="Sledeća slika">›</button>
    </div>
    <div class="lightbox-caption" id="lbCaption"></div>
  </div>
</div>
<script src="{{ '/assets/js/gallery.js' | relative_url }}"></script>
</body>
</html>
